<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2人スケジュール共有</title>
<style>
:root{--chita:#d32f2f;--chita-bg:#ffebee;--akita:#1976d2;--akita-bg:#e3f2fd;--bg:#f5f5f5;--text:#333;--bd:#ccc}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text)}
#app{display:flex;flex-direction:column;width:100vw;height:100vh;height:100dvh}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#fff;border-bottom:1px solid var(--bd);height:44px;flex-shrink:0;position:relative}
.nav{display:flex;align-items:center;gap:6px}
header button{background:#fff;border:1px solid var(--bd);padding:4px 8px;border-radius:4px;font-size:13px;cursor:pointer}
#title{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:bold;pointer-events:none;white-space:nowrap}
.hr{display:flex;gap:6px;z-index:1}
.dark{background:#333!important;color:#fff!important;border-color:#333!important}
.gray{background:#555!important;color:#fff!important;border-color:#555!important}
#content{flex:1;position:relative;overflow:hidden}
.pane{position:absolute;inset:0;display:none;flex-direction:column;padding:4px; /* ここに下部の余白を追加 */ padding-bottom: 90px;}
.pane.active{display:flex}
/* 月 */
.wk-head{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;font-size:13px;font-weight:bold;text-align:center;padding:3px 0;border-bottom:1px solid var(--bd);flex-shrink:0}
.wk-head div:nth-child(6){color:var(--akita)}.wk-head div:nth-child(7){color:var(--chita)}
#monthGrid{display:flex;flex-direction:column;flex:1;background:var(--bd);gap:1px;border:1px solid var(--bd);border-radius:4px;overflow:hidden}
.mrow{display:grid;grid-template-columns:repeat(7,1fr);flex:1;gap:1px;background:var(--bd);min-height:0}
.cell{background:#fff;padding:2px;display:flex;flex-direction:column;cursor:pointer;overflow:hidden;font-size:9px;min-height:0}
.cell.other{background:#f9f9f9;color:#bbb;cursor:default}
.cell .dn{font-weight:400;font-size:16px;margin-bottom:2px;line-height:1;flex-shrink:0}
.cell.sat .dn{color:var(--akita)}.cell.sun .dn,.cell.holiday .dn{color:var(--chita)}
.cell.today{background:#fff9e6}
.cell.today .dn{font-weight:800}
.sum{font-size:8.5px;line-height:1.1;margin-top:1px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;word-break:break-all}
.sum.p{-webkit-line-clamp:3}.sum.m{-webkit-line-clamp:2;color:#666}
.sum .ptag{font-size:8px;padding:0 2px;margin-right:2px;line-height:1.2}

/* 週 */
#weekBox{display:flex;flex-direction:column;flex:1;gap:2px;overflow:hidden}
.wrow{display:flex;background:#fff;border:1px solid var(--bd);border-radius:4px;flex:1;overflow:hidden;min-height:0}
.wdate{width:55px;background:#eee;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:13px;font-weight:400;border-right:1px solid var(--bd);flex-shrink:0;white-space:nowrap}
.wrow.today{background:#fff9e6}
.wrow.today .wdate{background:#fdf1c7;font-weight:800}
.wrow.today .wedit{background:transparent}
.wdate.sat{color:var(--akita)}.wdate.sun,.wdate.holiday{color:var(--chita)}
.wdata{flex:1;display:flex;flex-direction:column;justify-content:space-around;padding:2px 6px;font-size:12px;overflow:hidden;min-width:0}
.wedit{flex:0 0 38px;margin-left:auto;border:none;background:#fafafa;font-size:16px;cursor:pointer}
.prow{display:flex;align-items:baseline;gap:4px;overflow:hidden;line-height:1.25}
.ptext{flex:1;display:flex;align-items:center;gap:4px;overflow:hidden;word-break:break-all;min-width:0}
.ptag{font-weight:bold;padding:1px 4px;border-radius:2px;font-size:11px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;}
.ptag.chita{background:var(--chita-bg);color:var(--chita)}.ptag.akita{background:var(--akita-bg);color:var(--akita)}
.lbl{display:inline-block;background:#eee;color:#666;font-size:10px;padding:0 3px;margin:0 2px 0 4px;border-radius:2px;line-height:1.3}
/* 入力行(部分編集・一括編集で共通) */
.eline{display:flex;gap:3px;width:100%}
.eline input,.eline select{font-size:11px;padding:3px 2px;border:1px solid var(--bd);border-radius:3px;background:#fff;min-width:0;flex:1}
.eline .plan{flex:3}.eline .short{flex:1.2;text-align:center}.eline select{flex:1.4}
/* タブ */
.tabbar{display:flex;height:75px;background:#fff;border-top:1px solid var(--bd);flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#777;font-size:13px;cursor:pointer}
.tab.active{color:#333;font-weight:bold;background:#fafafa}
.tab span{font-size:20px;margin-bottom:3px}
/* モーダル */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:1000}
.overlay.open{display:flex}
.modal{background:#fff;width:92%;max-width:400px;height:76.5vh;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);font-weight:bold;flex-shrink:0}
.x{background:none;border:none;font-size:18px;cursor:pointer;color:#555;padding:4px}
.mb{padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;font-size:12px;overflow-x:hidden}
.mf{padding:10px 14px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
.mf button{padding:8px 16px;font-size:14px;border-radius:6px;cursor:pointer;border:1px solid #333}
.mf button:disabled{opacity:.5}
.fg{margin-bottom:10px}
.fg label{display:block;font-weight:bold;margin-bottom:3px;font-size:11px;color:#555}
.fg input,.fg select{width:100%;padding:6px;border:1px solid var(--bd);border-radius:4px;font-size:13px;background:#fff}
.sec{margin:12px 0 6px;border-bottom:2px dashed #eee;font-weight:bold;font-size:11px}
.sec.chita,.mini.chita{color:var(--chita)}.sec.akita,.mini.akita{color:var(--akita)}
.mini{font-size:10px;font-weight:bold;margin-top:2px}
.bhead{display:flex;justify-content:space-between;align-items:center;background:#eee;padding:4px 8px;margin-top:10px;border-radius:3px;font-weight:bold}
.bhead label{font-size:11px;font-weight:normal;cursor:pointer;display:flex;align-items:center;gap:3px}
.bbody{padding:4px 0}.bbody .eline{margin-bottom:3px}
.wsel{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd);flex-shrink:0}
.wsel button{flex:1;padding:8px;font-size:14px;font-weight:bold;border-radius:6px;border:2px solid var(--bd);background:#fff;cursor:pointer}
.wsel button.chita.on{background:var(--chita);border-color:var(--chita);color:#fff}
.wsel button.akita.on{background:var(--akita);border-color:var(--akita);color:#fff}
.wsel button.common.on{background:#555;border-color:#555;color:#fff}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);max-width:90%;padding:8px 14px;border-radius:18px;background:#333;color:#fff;font-size:13px;z-index:2000;display:none;text-align:center}
#toast.err{background:#c62828}
.embedded .tabbar{display:none}
/* 一括編集モーダルの余白を詰める */
#batchModal .modal{height:85vh}
#batchBody{padding:6px 12px}
#batchBody .bhead{margin-top:6px;padding:3px 8px}
#batchBody .bhead:first-child{margin-top:0}
#batchBody .bbody{padding:3px 0 0}
#batchBody .bbody .eline{margin-bottom:0}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="nav">
      <button onclick="changePeriod(-1)">◀︎</button>
      <button id="todayBtn" onclick="resetToCurrent()">今月</button>
      <button onclick="changePeriod(1)">▶︎</button>
    </div>
    <div id="title"></div>
    <div class="hr">
      <button class="dark" id="batchBtn" onclick="openBatch()" style="display:none">一括編集</button>
    </div>
  </header>

  <div id="content">
    <div id="tabMonth" class="pane active">
      <div class="wk-head"><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div><div>日</div></div>
      <div id="monthGrid"></div>
    </div>
    <div id="tabWeek" class="pane"><div id="weekBox"></div></div>
  </div>

  <nav class="tabbar">
    <a class="tab active" onclick="switchTab('month')"><span>📅</span>月表示</a>
    <a class="tab" onclick="switchTab('week')"><span>📋</span>週表示</a>
  </nav>
</div>

<div class="overlay" id="detailModal"><div class="modal">
  <div class="mh"><span id="detailTitle"></span><button class="x" onclick="closeModal('detailModal')">×</button></div>
  <div class="mb" id="detailBody"></div>
  <div class="mf"><button class="dark" onclick="openEditFromDetail()">編集する</button></div>
</div></div>

<div class="overlay" id="editModal"><div class="modal">
  <div class="mh"><span id="editTitle"></span><button class="x" onclick="closeModal('editModal')">×</button></div>
  <div class="mb" id="editBody"></div>
  <div class="mf"><button class="dark" id="editSaveBtn" onclick="saveSingle()">保存</button></div>
</div></div>

<div class="overlay" id="batchModal"><div class="modal">
  <div class="mh"><span>1週間分の一括編集</span><button class="x" onclick="closeModal('batchModal')">×</button></div>
  <div class="wsel" id="batchWho"></div>   <!-- ← この1行を追加 -->
  <div class="mb" id="batchBody"></div>
  <div class="mf"><button class="dark" id="batchSaveBtn" onclick="saveBatch()">一括保存</button></div>
</div></div>

<div id="toast"></div>

<script>
// ============ 設定 ============
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzPTJrE28rxHgOo_k59ilRx-Pz8rW1AL-29EljLi_IH3HzshYC0HVn46-9b1EaLuXd0CQ/exec";

const DOW = ['日','月','火','水','木','金','土'];
const OPTS = ['◯','×','未定'];
const CH = { id:'c', key:'chita', tag:'ちーた', short:'ち', cls:'chita' };
const AK = { id:'a', key:'akita', tag:'あきた', short:'あ', cls:'akita' };
const PEOPLE = [CH, AK];

let tab = 'month';
let cur = new Date();
let data = {};          // { "2026-10-5": {...} }
let busy = false;
let batch = null;       // 一括編集の作業用データ
let edit = null;        // 単日編集の対象

// ============ ユーティリティ ============
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyOf = d => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;

let toastTimer;
function toast(msg, type, ms) {
  const t = $('toast');
  t.textContent = msg;
  t.className = type === 'err' ? 'err' : '';
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = 'none', ms || 2200);
}

function mondayOf(date) {
  const w = date.getDay();
  return new Date(date.getFullYear(), date.getMonth(), date.getDate() + (w === 0 ? -6 : 1 - w));
}
function weekDates(monday) {
  return [...Array(7)].map((_, i) => new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i));
}

// ============ 祝日 ============
function baseHolidayName(dt) {
  const y = dt.getFullYear(), m = dt.getMonth() + 1, d = dt.getDate(), w = dt.getDay();
  const nthMon = n => w === 1 && d >= (n - 1) * 7 + 1 && d <= n * 7;
  const k = y - 1980, adj = Math.floor(k / 4);
  const spring = Math.floor(20.8431 + 0.242194 * k - adj);
  const autumn = Math.floor(23.2488 + 0.242194 * k - adj);
  if (m === 1 && d === 1) return '元日';
  if (m === 1 && nthMon(2)) return '成人の日';
  if (m === 2 && d === 11) return '建国記念の日';
  if (m === 2 && d === 23) return '天皇誕生日';
  if (m === 3 && d === spring) return '春分の日';
  if (m === 4 && d === 29) return '昭和の日';
  if (m === 5 && d === 3) return '憲法記念日';
  if (m === 5 && d === 4) return 'みどりの日';
  if (m === 5 && d === 5) return 'こどもの日';
  if (m === 7 && nthMon(3)) return '海の日';
  if (m === 8 && d === 11) return '山の日';
  if (m === 9 && nthMon(3)) return '敬老の日';
  if (m === 9 && d === autumn) return '秋分の日';
  if (m === 10 && nthMon(2)) return 'スポーツの日';
  if (m === 11 && d === 3) return '文化の日';
  if (m === 11 && d === 23) return '勤労感謝の日';
  return null;
}
function holidayName(dt) {
  const b = baseHolidayName(dt);
  if (b) return b;
  // 振替休日: 直前の連続する祝日の先頭が日曜なら休み
  const t = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - 1);
  while (baseHolidayName(t)) {
    if (t.getDay() === 0) return '振替休日';
    t.setDate(t.getDate() - 1);
  }
  return null;
}
function baseHoliday(dt) {
  return dt.getDay() === 0 || dt.getDay() === 6 || holidayName(dt) !== null;
}
// 手動設定(true/false)があればそれを優先、なければ自動判定
function isHoliday(dt) {
  const ov = data[keyOf(dt)]?.isHolidayOverride;
  return typeof ov === 'boolean' ? ov : baseHoliday(dt);
}

// ============ 通信 ============
async function parseJson(res) {
  const t = await res.text();
  try { return JSON.parse(t); }
  catch (e) {
    throw new Error('JSON以外の応答です(GASのデプロイ設定を確認): ' + t.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 100));
  }
}

async function loadData(silent) {
  let last;
  for (let i = 0; i < 3; i++) {
    try {
      const res = await fetch(GAS_API_URL + '?t=' + Date.now());
      const j = await parseJson(res);
      if (j && j.status === 'error') throw new Error(j.message);
      data = j || {};
      render();
      if (!silent) toast('読み込みました');
      return true;
    } catch (e) {
      last = e;
      await sleep(700 * (i + 1));
    }
  }
  toast('読み込みに失敗: ' + last.message, 'err', 8000);
  return false;
}

// 保存対象の要約が一致するか(保存確認用)
function sameCore(a, b) {
  if (!a || !b) return false;
  const g = o => [o.chita?.plan, o.chita?.returnTime, o.akita?.plan, o.akita?.returnTime, o.menu, o.memo].map(v => v || '').join('\u0001');
  return g(a) === g(b);
}

async function postItems(payload) {
  const body = JSON.stringify(payload);
  const headers = { 'Content-Type': 'text/plain;charset=utf-8' }; // プリフライトを避ける
  try {
    const res = await fetch(GAS_API_URL, { method: 'POST', headers, body });
    const j = await parseJson(res);
    if (j.status === 'success') return { ok: true };
    const err = new Error(j.message || 'GASでエラーが発生しました');
    err.fromGas = true;
    throw err;
  } catch (e) {
    if (e.fromGas) return { ok: false, msg: e.message };
  }
  // 応答が読めなかった場合: 送信だけ行い、読み戻して保存されたか確認する
  try {
    await fetch(GAS_API_URL, { method: 'POST', mode: 'no-cors', headers, body });
    await sleep(2000);
    const res = await fetch(GAS_API_URL + '?t=' + Date.now());
    const j = await parseJson(res);
    if (Object.keys(payload).every(k => sameCore(payload[k], j[k]))) return { ok: true };
    return { ok: false, msg: '保存されたことを確認できませんでした' };
  } catch (e) {
    return { ok: false, msg: e.message };
  }
}

async function saveKeys(keys, btn, label) {
  if (busy) return false;
  const payload = {};
  keys.forEach(k => { if (data[k]) payload[k] = data[k]; });
  if (!Object.keys(payload).length) return true;
  busy = true;
  if (btn) { btn.disabled = true; btn.textContent = '保存中...'; }
  const r = await postItems(payload);
  busy = false;
  if (btn) { btn.disabled = false; btn.textContent = label; }
  if (r.ok) toast('保存しました');
  else toast('保存に失敗: ' + r.msg, 'err', 8000);
  return r.ok;
}

// ============ 画面切り替え ============
function render() { tab === 'month' ? renderMonth() : renderWeek(); }

function switchTab(t) {
  tab = t;
  $('tabMonth').classList.toggle('active', t === 'month');
  $('tabWeek').classList.toggle('active', t === 'week');
  document.querySelectorAll('.tab').forEach((el, i) => el.classList.toggle('active', (i === 0) === (t === 'month')));
  const week = t === 'week';
  $('batchBtn').style.display = week ? 'block' : 'none';
  $('todayBtn').textContent = week ? '今週' : '今月';
  render();
}

function changePeriod(dir) {
  if (tab === 'month') cur = new Date(cur.getFullYear(), cur.getMonth() + dir, 1);
  else cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + dir * 7);
  render();
}

function resetToCurrent() {
  cur = new Date();
  render();
}

// ============ 月表示 ============
function renderMonth() {
  const y = cur.getFullYear(), m = cur.getMonth();
  $('title').textContent = `${y}年 ${m + 1}月`;
  const wrap = $('monthGrid');
  wrap.innerHTML = '';

  const offset = (new Date(y, m, 1).getDay() + 6) % 7;
  const lastDate = new Date(y, m + 1, 0).getDate();
  const weeks = Math.ceil((offset + lastDate) / 7);
  const todayKey = keyOf(new Date());

  for (let w = 0; w < weeks; w++) {
    const row = document.createElement('div');
    row.className = 'mrow';
    for (let i = 0; i < 7; i++) {
      const dt = new Date(y, m, 1 - offset + w * 7 + i);
      const cell = document.createElement('div');
      if (dt.getMonth() !== m) {
        cell.className = 'cell other';
        cell.innerHTML = `<div class="dn">${dt.getDate()}</div>`;
      } else {
        const dow = dt.getDay();
        const cls = dow === 6 ? 'sat' : dow === 0 ? 'sun' : isHoliday(dt) ? 'holiday' : '';
        const k = keyOf(dt), dd = data[k] || {};
        cell.className = `cell ${cls} ${k === todayKey ? 'today' : ''}`;
        cell.onclick = () => openDetail(dt);
        cell.innerHTML = `
          <div class="dn">${dt.getDate()}</div>
          <div class="sum p">${dd.chita?.plan ? '<span class="ptag chita">ち</span>' + esc(dd.chita.plan) : ''}</div>
          <div class="sum p">${dd.akita?.plan ? '<span class="ptag akita">あ</span>' + esc(dd.akita.plan) : ''}</div>
          <div class="sum m">${dd.menu ? 'メ:' + esc(dd.menu) : ''}</div>`;
      }
      row.appendChild(cell);
    }
    wrap.appendChild(row);
  }
}

// ============ 週表示 ============
function personText(p, hol) {
  const L = (name, v) => `<span class="lbl">${name}</span>${esc(v) || '-'}`;
  if (hol) return `${esc(p.plan)} ${L('出', p.departTime)} ${L('帰', p.returnTime)} ${L('昼', p.lunch)} ${L('夕', p.dinner)}`;
  return p.plan ? `${esc(p.plan)} ${L('帰', p.returnTime)} ${L('夕', p.dinner)}` : '-';
}

// 入力欄(部分編集・一括編集で共通)。ID = モード_日付_人_項目
function selectHtml(id, val, prefix) {
  return `<select id="${id}">${OPTS.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${prefix}${o}</option>`).join('')}</select>`;
}
function editLine(mode, key, who, p, hol) {
  const id = f => `${mode}_${key}_${who.id}_${f}`;
  return `<input class="plan" id="${id('plan')}" value="${esc(p.plan)}" placeholder="予定">`
    + (hol ? `<input class="short" id="${id('dep')}" value="${esc(p.departTime)}" placeholder="出">` : '')
    + `<input class="short" id="${id('ret')}" value="${esc(p.returnTime)}" placeholder="帰">`
    + (hol ? selectHtml(id('lun'), p.lunch || '未定', '昼') : '')
    + selectHtml(id('din'), p.dinner || '未定', '夕');
}

function renderWeek() {
  const monday = mondayOf(cur);
  const days = weekDates(monday);
  const last = days[6];
  $('title').textContent = `${monday.getMonth() + 1}/${monday.getDate()} 〜 ${last.getMonth() + 1}/${last.getDate()}`;
  const box = $('weekBox');
  box.innerHTML = '';
  const todayKey = keyOf(new Date());   // ← 追加
  
  

  days.forEach(dt => {
    const k = keyOf(dt), dd = data[k] || {};
    const hol = isHoliday(dt);
    const cls = dt.getDay() === 6 ? 'sat' : dt.getDay() === 0 ? 'sun' : hol ? 'holiday' : '';
    const c = dd.chita || {}, a = dd.akita || {};

    const row = document.createElement('div');
    row.className = 'wrow' + (k === todayKey ? ' today' : '');   // ← 変更
    row.innerHTML = `
      <div class="wdate ${cls}"><span>${dt.getMonth() + 1}/${dt.getDate()}</span><span>(${DOW[dt.getDay()]})</span></div>
      <div class="wdata">
        <div class="prow"><span class="ptag chita">ちーた</span><div class="ptext"><span>${personText(c, hol)}</span></div></div>
        <div class="prow"><span class="ptag akita">あきた</span><div class="ptext"><span>${personText(a, hol)}</span></div></div>
        <div class="prow" style="font-size:11px;color:#666"><b style="flex-shrink:0">メニュー:</b><div class="ptext"><span>${esc(dd.menu) || '-'}</span></div></div>
      </div>
      <button class="wedit" aria-label="編集">✍🏻</button>`;
    row.querySelector('.wedit').onclick = () => openEdit(dt);

    box.appendChild(row);
  });
}

// ============ 入力値の収集(共通) ============
const FIELD_MAP = { plan: 'plan', dep: 'departTime', ret: 'returnTime', lun: 'lunch', din: 'dinner' };

function collectPerson(mode, key, who, old) {
  const o = Object.assign({}, old || {});
  for (const f in FIELD_MAP) {
    const el = $(`${mode}_${key}_${who.id}_${f}`);
    if (el) o[FIELD_MAP[f]] = el.value; // 画面に無い項目(平日の出発・昼食)は既存値を保持
  }
  return o;
}
function collectDay(mode, key, old) {
  old = old || {};
  const item = Object.assign({}, old, {
    chita: collectPerson(mode, key, CH, old.chita),
    akita: collectPerson(mode, key, AK, old.akita)
  });
  ['menu', 'memo'].forEach(f => { const el = $(`${mode}_${key}_${f}`); if (el) item[f] = el.value; });
  return item;
}
function isEmptyItem(it) {
  const t = p => [p?.plan, p?.departTime, p?.returnTime].some(v => v);
  return !t(it.chita) && !t(it.akita) && !it.menu && !it.memo && typeof it.isHolidayOverride !== 'boolean';
}

// ============ 詳細 ============
function openDetail(dt) {
  const k = keyOf(dt), dd = data[k] || {};
  const hol = isHoliday(dt), name = holidayName(dt);
  const c = dd.chita || {}, a = dd.akita || {};
  $('detailTitle').textContent = `${dt.getMonth() + 1}月${dt.getDate()}日(${DOW[dt.getDay()]})${name ? ` (${name})` : ''} の詳細`;
  
  const person = (who, p) => {
    let h = `<div style="margin-top: 4px;">予定：${esc(p.plan) || '-'}</div>`;
    if (hol) {
      h += `<div style="margin-top: 4px;">出発：${esc(p.departTime) || '-'} ／ 帰宅：${esc(p.returnTime) || '-'}</div>` +
           `<div style="margin-top: 4px;">昼食：${esc(p.lunch) || '-'} ／ 夕食：${esc(p.dinner) || '-'}</div>`;
    } else {
      h += `<div style="margin-top: 4px;">帰宅時刻：${esc(p.returnTime) || '-'}</div>` +
           `<div style="margin-top: 4px;">夕食要否：${esc(p.dinner) || '-'}</div>`;
    }
    return `<div style="margin-bottom: 16px; line-height: 1.5; font-size: 13.5px;"><div style="color:var(--${who.cls}); font-weight: bold; font-size: 14.5px;">● ${who.tag}</div>${h}</div>`;
  };
  $('detailBody').innerHTML = person(CH, c) + person(AK, a) + `
    <div style="border-top: 1px solid #eee; padding-top: 10px; margin-top: 8px; line-height: 1.6; font-size: 13.5px;">
      <div style="margin-bottom: 6px;"><b>夕食メニュー：</b> ${esc(dd.menu) || '-'}</div>
      <div><b>備考：</b> ${esc(dd.memo) || '-'}</div>
    </div>`;

  $('detailBody').innerHTML = person(CH, c) + person(AK, a) + `
    <div style="border-top: 1px solid #eee; padding-top: 10px; margin-top: 8px; line-height: 1.6;">
      <div style="margin-bottom: 6px;"><b>夕食メニュー：</b> ${esc(dd.menu) || '-'}</div>
      <div><b>備考：</b> ${esc(dd.memo) || '-'}</div>
    </div>`;
    
  window.detailDate = dt;
  $('detailModal').classList.add('open');
}
function openEditFromDetail() {
  closeModal('detailModal');
  if (window.detailDate) openEdit(window.detailDate);
}

// ============ 単日編集 ============
function openEdit(dt) {
  const k = keyOf(dt), dd = data[k] || {};
  const hol = isHoliday(dt);
  edit = { key: k, date: dt };
  $('editTitle').textContent = `${dt.getMonth() + 1}月${dt.getDate()}日の編集`;

  const fg = (label, inner) => `<div class="fg"><label>${label}</label>${inner}</div>`;
  const inp = (id, v) => `<input type="text" id="${id}" value="${esc(v)}">`;
  const person = (who, p) => {
    const id = f => `edit_${k}_${who.id}_${f}`;
    return `<div class="sec ${who.cls}">■ ${who.tag}</div>`
      + fg('予定', inp(id('plan'), p.plan))
      + (hol ? fg('出発時刻', inp(id('dep'), p.departTime)) : '')
      + fg('帰宅時刻', inp(id('ret'), p.returnTime))
      + (hol ? fg('昼食要否', selectHtml(id('lun'), p.lunch || '未定', '')) : '')
      + fg('夕食要否', selectHtml(id('din'), p.dinner || '未定', ''));
  };
  $('editBody').innerHTML = person(CH, dd.chita || {}) + person(AK, dd.akita || {})
    + `<div class="sec">■ 共通・その他</div>`
    + fg('夕食メニュー', inp(`edit_${k}_menu`, dd.menu))
    + fg('備考', inp(`edit_${k}_memo`, dd.memo));
  $('editModal').classList.add('open');
}

async function saveSingle() {
  if (!edit) return;
  const k = edit.key;
  data[k] = collectDay('edit', k, data[k]);
  render();
  const ok = await saveKeys([k], $('editSaveBtn'), '保存');
  if (ok) closeModal('editModal');
}

// ============ 一括編集 ============
const BATCH_TABS = [
  { id: 'c', tag: 'ちーた', cls: 'chita', person: CH },
  { id: 'a', tag: 'あきた', cls: 'akita', person: AK },
  { id: 'm', tag: 'その他・設定', cls: 'common', person: null }
];

function renderBatch() {
  const body = $('batchBody');
  const scroll = body.scrollTop;
  const who = BATCH_TABS.find(t => t.id === batch.who).person;   // その他・設定タブでは null

  $('batchWho').innerHTML = BATCH_TABS.map(t =>
    `<button class="${t.cls} ${t.id === batch.who ? 'on' : ''}" onclick="setBatchWho('${t.id}')">${t.tag}</button>`
  ).join('');

  let html = '';
  weekDates(batch.monday).forEach(dt => {
    const k = keyOf(dt), dd = batch.draft[k] || {};
    const hol = batchHol(dt), name = holidayName(dt);
    const label = `${dt.getMonth() + 1}/${dt.getDate()} (${DOW[dt.getDay()]}) ${name ? `[${name}]` : ''}`;

    if (who) {
      const p = (who.id === CH.id ? dd.chita : dd.akita) || {};
      html += `
        <div class="bhead"><span>${label}</span></div>
        <div class="bbody"><div class="eline">${editLine('batch', k, who, p, hol)}</div></div>`;
    } else {
      html += `
        <div class="bhead">
          <span>${label}</span>
          <label><input type="checkbox" id="batch_hol_${k}" ${hol ? 'checked' : ''} onchange="toggleBatchHol('${k}')"> 休日設定</label>
        </div>
        <div class="bbody">
          <div class="eline">
            <input id="batch_${k}_menu" value="${esc(dd.menu)}" placeholder="夕食メニュー">
            <input id="batch_${k}_memo" value="${esc(dd.memo)}" placeholder="備考">
          </div>
        </div>`;
    }
  });
  body.innerHTML = html;
  body.scrollTop = scroll;
}

function openBatch() {
  const monday = mondayOf(cur);
  batch = { monday, draft: {}, ov: {}, who: 'c' };
  weekDates(monday).forEach(dt => {
    const k = keyOf(dt);
    batch.draft[k] = clone(data[k] || {});
    batch.ov[k] = data[k]?.isHolidayOverride;
  });
  renderBatch();
  $('batchBody').scrollTop = 0;
  $('batchModal').classList.add('open');
}

function setBatchWho(id) {
  if (batch.who === id) return;
  collectBatch();                       // 入力途中の内容を退避
  batch.who = id;
  renderBatch();
  $('batchBody').scrollTop = 0;
}


function batchHol(dt) {
  const o = batch.ov[keyOf(dt)];
  return typeof o === 'boolean' ? o : baseHoliday(dt);
}

function collectBatch() {
  weekDates(batch.monday).forEach(dt => {
    const k = keyOf(dt);
    batch.draft[k] = collectDay('batch', k, batch.draft[k]);
  });
}

function toggleBatchHol(k) {
  collectBatch();                       // 入力途中の内容を退避
  batch.ov[k] = $(`batch_hol_${k}`).checked;
  renderBatch();
}

async function saveBatch() {
  collectBatch();
  const keys = [];
  weekDates(batch.monday).forEach(dt => {
    const k = keyOf(dt);
    const item = batch.draft[k];
    const ov = batch.ov[k];
    // 自動判定と同じ設定なら上書き情報は持たない
    item.isHolidayOverride = (typeof ov === 'boolean' && ov !== baseHoliday(dt)) ? ov : null;
    if (!data[k] && isEmptyItem(item)) return;
    data[k] = item;
    keys.push(k);
  });
  render();
  const ok = await saveKeys(keys, $('batchSaveBtn'), '一括保存');
  if (ok) closeModal('batchModal');
}

function closeModal(id) { $(id).classList.remove('open'); }

// ============ スワイプ・起動 ============
let sx = 0;
const content = $('contentContainer') || $('content');
content.addEventListener('touchstart', e => { sx = e.changedTouches[0].screenX; }, { passive: true });
content.addEventListener('touchend', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const dx = e.changedTouches[0].screenX - sx;
  if (dx < -50) changePeriod(1);
  else if (dx > 50) changePeriod(-1);
}, { passive: true });

// アプリに戻ってきたとき、編集中でなければ最新データを取り直す(2人間の同期)
document.addEventListener('visibilitychange', () => {
  const modalOpen = document.querySelector('.overlay.open');
  if (document.visibilityState === 'visible' && !busy && !modalOpen) loadData(true);
});
if (window.parent !== window) document.body.classList.add('embedded');
window.addEventListener('message', e => {
  if (e.source !== window.parent || !e.data || e.data.type !== 'tab') return;
  switchTab(e.data.tab);
  loadData(true);
});

switchTab('month');
loadData();
</script>

<head>
<meta charset="UTF-8">
<!-- OGPタグ -->
<meta property="og:description" content="2人のスケジュールや精算を簡単に管理・共有できるアプリです。">
<meta property="og:type" content="website">

<!-- viewport-fit=cover を削除(iOSのステータスバー部分のぼかし対策) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>あきた＆ちーた</title>
<link rel="icon" href="./favicon.png" type="image/png">
<link rel="apple-touch-icon" href="./favicon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:#f5f5f5}
#root{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh}

.frames{flex:1;position:relative;min-height:0;background:#f5f5f5}

iframe{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  border:0;
  display:none;
  background:#f5f5f5;
}
iframe.active{display:block}

nav {
  position: absolute;
  bottom: 0;
  left: 16px;
  right: 16px;
  height: 64px;
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 32px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 1000;
}

.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:none;background:none;color:#777;font-size:12px;cursor:pointer}
.tab span{font-size:18px;margin-bottom:2px}
.tab.sep{border-left:none solid #ddd}
.tab.active{color:#333;font-weight:bold;background:none}
</style>
</head>

<body>
<div id="root">
  <div class="frames">
    <iframe id="f-schedule" title="スケジュール"></iframe>
    <iframe id="f-settle" title="精算"></iframe>
  </div>
  <nav id="tabbar"></nav>
</div>

<script>
// 各アプリのファイル名
const FILES = { schedule: 'schedule.html', settle: 'settle.html' };

// 下部タブ(左から順に並ぶ)
const TABS = [
  { id: 'month', app: 'schedule', icon: '📅', label: '月予定' },
  { id: 'week',  app: 'schedule', icon: '📋', label: '週予定' },
  { id: 'input', app: 'settle',   icon: '💰', label: '精算入力' },
  { id: 'list',  app: 'settle',   icon: '🧾', label: '精算一覧' }
];

const frames  = { schedule: document.getElementById('f-schedule'), settle: document.getElementById('f-settle') };
const started = { schedule: false, settle: false };  // iframeにURLを設定済みか
const loaded  = { schedule: false, settle: false };  // 読み込み完了か
const pending = {};                                  // 読み込み前に受けたタブ切り替え

// タブバーを作る
const bar = document.getElementById('tabbar');
TABS.forEach((t, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'tab' + (i > 0 && TABS[i - 1].app !== t.app ? ' sep' : '');
  b.id = 'tab-' + t.id;
  b.innerHTML = `<span>${t.icon}</span>${t.label}`;
  b.onclick = () => show(t.id);
  bar.appendChild(b);
});

function paint(id) {
  TABS.forEach(t => document.getElementById('tab-' + t.id).classList.toggle('active', t.id === id));
}

function send(app, tab) {
  if (loaded[app]) frames[app].contentWindow.postMessage({ type: 'tab', tab }, '*');
  else pending[app] = tab;
}

function show(id) {
  const t = TABS.find(x => x.id === id);
  Object.keys(frames).forEach(a => frames[a].classList.toggle('active', a === t.app));
  if (!started[t.app]) {            // 初めて開くときだけ読み込む
    started[t.app] = true;
    frames[t.app].src = FILES[t.app];
  }
  send(t.app, id);
  paint(id);
}

Object.keys(frames).forEach(app => {
  frames[app].addEventListener('load', () => {
    if (!started[app]) return;
    loaded[app] = true;
    if (pending[app]) { send(app, pending[app]); delete pending[app]; }
  });
});

// 精算アプリ側が自分でタブを切り替えたとき(保存後に一覧へ移動する等)、ハイライトを合わせる
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'tabChanged') paint(e.data.tab);
});

show('month');
</script>
</body>
</html>
